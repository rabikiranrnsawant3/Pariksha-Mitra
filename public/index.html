<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Devanagari","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:258px;background:linear-gradient(180deg,#102a56,#0a1d3d);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:5;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:4px 10px 25px;border-bottom:1px solid #ffffff20}.logo{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:21px}.brand strong{display:block;font-size:17px}.brand small{color:#b9c9e4;font-size:11px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#8ea4c8;padding:23px 12px 9px}.nav button{width:100%;border:0;background:transparent;color:#c9d6eb;text-align:left;padding:12px;border-radius:9px;margin:2px 0;font-size:13px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:14px 10px;color:#9db0d0;font-size:11px;border-top:1px solid #ffffff20;line-height:1.7}.main{margin-left:258px;width:calc(100% - 258px)}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:15px}.pill{font-size:11px;padding:7px 10px;border-radius:20px;background:#eaf2ff;color:#1d4ed8;font-weight:700}.avatar{width:35px;height:35px;border-radius:50%;background:#dbeafe;color:#1e40af;display:grid;place-items:center;font-weight:800;font-size:12px}.content{padding:28px 30px 50px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:23px}.page-head h1{margin:0 0 6px;font-size:25px;letter-spacing:-.5px}.page-head p{margin:0;color:var(--muted);font-size:13px}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;font-size:12px}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf1ff;color:#1d4ed8}.outline{background:#fff;border:1px solid var(--line);color:#334155}.success{background:#e8f8ef;color:#15803d}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 18px;box-shadow:0 2px 8px #0f172a05}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;background:#eef4ff;display:grid;place-items:center;font-size:17px}.stat h2{margin:12px 0 4px;font-size:27px}.stat small{font-size:11px;color:#16a34a}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;margin-bottom:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title h3{font-size:14px;margin:0}.panel-title span{font-size:11px;color:var(--muted)}.bar-row{display:grid;grid-template-columns:110px 1fr 35px;align-items:center;gap:10px;margin:15px 0;font-size:11px;color:#526078}.bar{height:8px;background:#edf1f7;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1d4ed8,#0ea5a4);border-radius:10px}.activity{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f6;font-size:12px}.activity:last-child{border:0}.dot{width:9px;height:9px;background:#16a34a;border-radius:50%;margin-top:4px;flex-shrink:0}.activity small{display:block;color:var(--muted);margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.6px;background:#f8fafc;padding:12px}td{padding:13px 12px;border-bottom:1px solid #edf0f5;font-size:12px}tbody tr:last-child td{border:0}.badge{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;display:inline-block}.b-green{background:#e8f8ef;color:#15803d}.b-yellow{background:#fff6df;color:#a16207}.b-blue{background:#eaf2ff;color:#1d4ed8}.b-red{background:#feecec;color:#b91c1c}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.search{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;min-width:220px;font-size:12px}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.module-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;cursor:pointer;transition:.2s}.module-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #102a5614}.module-card .bigico{font-size:24px;margin-bottom:13px}.module-card h3{font-size:14px;margin:0 0 7px}.module-card p{font-size:11px;color:var(--muted);line-height:1.6;margin:0 0 14px}.module-card a{font-size:11px;color:var(--blue);font-weight:800}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:11px;font-weight:700;color:#526078;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5ef;border-radius:8px;padding:10px 11px;font-size:12px;background:#fff;color:#334155}.field textarea{min-height:80px;resize:vertical}.field.full{grid-column:1/-1}.note{padding:12px 14px;border-radius:9px;background:#eff6ff;color:#1e40af;font-size:11px;line-height:1.6;margin-bottom:15px}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0b173b80;display:grid;place-items:center;padding:20px;z-index:20}.modal-box{background:#fff;border-radius:14px;width:min(550px,100%);padding:22px;box-shadow:0 20px 60px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:17px}.close{border:0;background:#f1f5f9;border-radius:7px;width:30px;height:30px}.toast{position:fixed;right:25px;bottom:25px;background:#102a56;color:#fff;padding:13px 18px;border-radius:9px;font-size:12px;box-shadow:0 8px 25px #0002;z-index:30}.mobile-menu{display:none}.footer-note{font-size:10px;color:#94a3b8;text-align:center;padding:20px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin:0;width:100%}.topbar{padding:0 15px}.mobile-menu{display:inline-block;border:0;background:#eef4ff;padding:8px 10px;border-radius:8px;margin-right:9px}.content{padding:20px 14px}.cards{gap:9px}.stat{padding:13px}.stat h2{font-size:22px}.module-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .pill{display:none}}
</style>

<script>
const pages={
dashboard:{title:"Dashboard",sub:"परीक्षा व्यवस्थापनाचा एकत्रित आढावा",render:dashboard},
verification:{title:"Candidate Verification",sub:"Biometric आणि Face Recognition द्वारे उमेदवार पडताळणी",render:verification},
security:{title:"Question Paper Security",sub:"Question Paper Vault आणि Chain of Custody",render:security},
exam:{title:"Exam Management",sub:"परीक्षा नियोजन, वेळापत्रक आणि Centre Allocation",render:exam},
answer:{title:"Answer Key & Evaluation",sub:"Answer key objections, evaluation आणि moderation",render:answer},
results:{title:"Result Declaration",sub:"निकाल, Scorecard आणि Merit List व्यवस्थापन",render:results},
analytics:{title:"Analytics & Reports",sub:"परीक्षा संबंधित अहवाल आणि कामगिरी विश्लेषण",render:analytics},
portal:{title:"Candidate Portal",sub:"उमेदवार अर्ज, Hall Ticket आणि Scorecard",render:portal},
settings:{title:"Settings",sub:"पोर्टल सेटिंग्ज आणि प्रणाली माहिती",render:settings}
};
let current="dashboard";
const state={candidates:[["PS260001","Aarav Patil","MHT-CET 2026","Verified"],["PS260002","Sneha Jadhav","Scholarship Exam","Pending"],["PS260003","Rohan Shinde","MHT-CET 2026","Verified"],["PS260004","Pooja More","Police Bharti","Flagged"]],papers:[["QP-MHT-01","MHT-CET Physics","Sealed","Pune Strong Room"],["QP-MHT-02","MHT-CET Chemistry","In Transit","Mumbai Hub"],["QP-SCH-01","Scholarship Paper","Sealed","District Vault"]],exams:[["EX-2026-01","MHT-CET 2026","2026-12-12","Pune Division","Scheduled"],["EX-2026-02","Scholarship Exam","2026-12-20","All Districts","Planning"],["EX-2026-03","Police Bharti","2027-01-05","Solapur","Scheduled"]],objections:[["OBJ-1021","PS260001","Question 14 – Physics","Under Review"],["OBJ-1022","PS260003","Question 32 – Chemistry","Resolved"]],results:[["PS260001","Aarav Patil","MHT-CET 2026","92.40","12"],["PS260003","Rohan Shinde","MHT-CET 2026","88.75","28"],["PS260005","Isha Kulkarni","MHT-CET 2026","95.20","4"]]};
function head(title,sub,action=""){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function stat(label,value,icon,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><h2>${value}</h2><small>${foot}</small></div>`}
function panel(title,body,right=""){return `<div class="panel"><div class="panel-title"><h3>${title}</h3><span>${right}</span></div>${body}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function badge(s){let c=s==="Verified"||s==="Sealed"||s==="Resolved"||s==="Published"?"b-green":s==="Pending"||s==="Planning"||s==="Under Review"||s==="In Transit"?"b-yellow":s==="Flagged"?"b-red":"b-blue";return `<span class="badge ${c}">${s}</span>`}
function dashboard(){return head("नमस्कार, Admin 👋","आजच्या परीक्षा व्यवस्थापनाची स्थिती पाहा",`<button class="btn primary" onclick="openModal('नवीन परीक्षा तयार करा',examForm)">＋ नवीन परीक्षा`) + `<div class="cards">${stat("Registered Candidates","24,580","♙","+12.8% मागील महिन्यापेक्षा")}${stat("Scheduled Exams","18","▤","या सत्रात")}${stat("Verification Complete","96.4%","◉","उमेदवार पडताळणी")}${stat("Results Published","06","🏆","एकूण परीक्षा")}</div><div class="grid2">${panel("Module Overview",`<div class="bar-row"><span>Candidate Verification</span><div class="bar"><i style="width:96%"></i></div><b>96%</b></div><div class="bar-row"><span>Centre Allocation</span><div class="bar"><i style="width:82%"></i></div><b>82%</b></div><div class="bar-row"><span>Answer Evaluation</span><div class="bar"><i style="width:68%"></i></div><b>68%</b></div><div class="bar-row"><span>Result Processing</span><div class="bar"><i style="width:54%"></i></div><b>54%</b></div>`,"LIVE STATUS")}${panel("Recent Activities",`<div class="activity"><i class="dot"></i><div>Candidate PS260001 verification completed<small>आज · 09:42 AM</small></div></div><div class="activity"><i class="dot" style="background:#eab308"></i><div>Question paper QP-MHT-02 dispatched<small>आज · 09:15 AM</small></div></div><div class="activity"><i class="dot"></i><div>MHT-CET 2026 centre allocation updated<small>काल · 05:30 PM</small></div></div><div class="activity"><i class="dot" style="background:#2563eb"></i><div>New answer-key objection received<small>काल · 02:10 PM</small></div></div>`,"LATEST")}</div>${panel("Upcoming Examinations",table(["Exam ID","Examination","Date","Region","Status"],state.exams.map(e=>[e[0],e[1],e[2],e[3],badge(e[4])])))}<div class="footer-note">PareekshaSetu Demo · सर्व आकडे नमुना स्वरूपातील आहेत.</div>`}
function verification(){return head(pages.verification.title,pages.verification.sub,`<button class="btn primary" onclick="openModal('नवीन उमेदवार पडताळणी',candidateForm)">＋ Verify Candidate</button>`)+`<div class="note">🔐 येथे biometric/face match साठी demo workflow दिला आहे. प्रत्यक्ष biometric device, camera, liveness detection आणि सुरक्षित backend जोडणे आवश्यक आहे.</div><div class="cards">${stat("Total Candidates","24,580","♙","नोंदणीकृत")}${stat("Verified","23,696","✓","96.4% पूर्ण")}${stat("Pending","720","◷","पडताळणी बाकी")}${stat("Flagged","164","⚑","Manual review आवश्यक")}</div>${panel("Candidate Verification Register",`<div class="toolbar"><input class="search" placeholder="Candidate ID / नाव शोधा..." oninput="filterRows(this, 'candidateTable')"><button class="btn outline" onclick="showToast('Verification report तयार होत आहे')">Export Report ↓</button></div><div id="candidateTable">${table(["Candidate ID","Candidate Name","Exam","Face/Biometric Status","Action"],state.candidates.map(c=>[c[0],c[1],c[2],badge(c[3]),`<button class="btn secondary" onclick="verify('${c[0]}')">Review</button>`]))}</div>`)}${panel("Verification Workflow",`<div class="module-grid"><div class="module-card"><div class="bigico">📷</div><h3>Face Recognition</h3><p>Live photo capture, face match आणि liveness verification.</p><a onclick="showToast('Camera integration आवश्यक आहे')">Open camera →</a></div><div class="module-card"><div class="bigico">👆</div><h3>Biometric Check-in</h3><p>Fingerprint/iris device द्वारे उपस्थिती पडताळणी.</p><a onclick="showToast('Biometric device जोडणे आवश्यक आहे')">Device status →</a></div><div class="module-card"><div class="bigico">🛡️</div><h3>Manual Review</h3><p>Mismatch किंवा संशयास्पद नोंदींची अधिकृत तपासणी.</p><a onclick="showToast('Manual review queue उघडली')">Review queue →</a></div></div>`)} `}
function security(){return head(pages.security.title,pages.security.sub,`<button class="btn primary" onclick="openModal('नवीन Paper Vault Entry',paperForm)">＋ Add Paper Entry</button>`)+`<div class="note">🔒 गोपनीय प्रश्नपत्रिका encrypted vault, role-based access, dual authorization आणि tamper-evident audit logs द्वारे सुरक्षित ठेवण्याची रचना.</div><div class="cards">${stat("Papers in Vault","42","▣","सुरक्षित नोंदी")}${stat("Sealed","36","🔐","सीलबंद")}${stat("In Transit","04","🚚","वाहतुकीत")}${stat("Access Alerts","02","⚠️","तपासणी आवश्यक")}</div>${panel("Question Paper Vault & Chain of Custody",`<div class="toolbar"><input class="search" placeholder="Paper ID / Subject शोधा..." oninput="filterRows(this,'paperTable')"><button class="btn outline" onclick="showToast('Audit log export सुरू')">Audit Log ↓</button></div><div id="paperTable">${table(["Paper ID","Examination","Vault Status","Current Location","Action"],state.papers.map(p=>[p[0],p[1],badge(p[2]),p[3],`<button class="btn secondary" onclick="showToast('Chain of custody: ${p[0]}')">Track</button>`]))}</div>`)}${panel("Security Controls",`<div class="module-grid"><div class="module-card"><div class="bigico">🔑</div><h3>Dual-Key Access</h3><p>दोन अधिकृत व्यक्तींच्या मंजुरीनंतरच access.</p><a onclick="showToast('Dual-key approval workflow')">Manage approvals →</a></div><div class="module-card"><div class="bigico">📦</div><h3>Seal Verification</h3><p>QR seal ID, dispatch आणि receipt confirmation.</p><a onclick="showToast('Seal verification screen')">Verify seal →</a></div><div class="module-card"><div class="bigico">🧾</div><h3>Chain of Custody</h3><p>प्रत्येक handover ची वेळ, अधिकारी आणि ठिकाण नोंद.</p><a onclick="showToast('Custody timeline उघडली')">View timeline →</a></div></div>`)} `}
function exam(){return head(pages.exam.title,pages.exam.sub,`<button class="btn primary" onclick="openModal('नवीन परीक्षा तयार करा',examForm)">＋ Create Exam</button>`)+`<div class="cards">${stat("Active Exams","18","▤","चालू सत्र")}${stat("Exam Centres","326","🏫","नोंदणीकृत केंद्रे")}${stat("Allocated Seats","21,450","♙","वाटप केलेल्या जागा")}${stat("Shifts","54","◷","एकूण सत्रे")}</div>${panel("Exam Schedule & Centre Allocation",`<div class="toolbar"><input class="search" placeholder="Exam / Region शोधा..." oninput="filterRows(this,'examTable')"><button class="btn outline" onclick="showToast('Schedule export तयार')">Download Schedule ↓</button></div><div id="examTable">${table(["Exam ID","Examination","Date","Region / Centres","Status","Action"],state.exams.map(e=>[e[0],e[1],e[2],e[3],badge(e[4]),`<button class="btn secondary" onclick="showToast('Centre allocation उघडले')">Allocate</button>`]))}</div>`)}${panel("Planning Tools",`<div class="module-grid"><div class="module-card"><div class="bigico">🗓️</div><h3>Exam Scheduling</h3><p>परीक्षेची तारीख, वेळ, shifts आणि subject mapping.</p><a onclick="showToast('Scheduling module')">Open schedule →</a></div><div class="module-card"><div class="bigico">📍</div><h3>Centre Allocation</h3><p>क्षमता, अंतर, शहर आणि PwD सुविधा विचारात घेऊन केंद्र वाटप.</p><a onclick="showToast('Centre allocation module')">Allocate centres →</a></div><div class="module-card"><div class="bigico">🎫</div><h3>Admit Card</h3><p>QR code असलेले Hall Ticket तयार करणे आणि डाउनलोड.</p><a onclick="showToast('Hall ticket generation')">Generate hall tickets →</a></div></div>`)} `}
function answer(){return head(pages.answer.title,pages.answer.sub,`<button class="btn primary" onclick="openModal('Answer Key Objection',objectionForm)">＋ Add Objection</button>`)+`<div class="cards">${stat("Objections Received","1,248","✉","एकूण हरकती")}${stat("Under Review","186","◷","समितीकडे")}${stat("Resolved","1,062","✓","निकाली")}${stat("Evaluation Progress","78%","☑","मूल्यांकन")}</div>${panel("Answer Key Objection Register",`<div class="toolbar"><input class="search" placeholder="Objection ID / Candidate..." oninput="filterRows(this,'objTable')"></div><div id="objTable">${table(["Objection ID","Candidate ID","Question / Subject","Status","Action"],state.objections.map(o=>[o[0],o[1],o[2],badge(o[3]),`<button class="btn secondary" onclick="showToast('Objection details उघडले')">Review</button>`]))}</div>`)}${panel("Evaluation & Moderation",`<div class="module-grid"><div class="module-card"><div class="bigico">🗝️</div><h3>Provisional Answer Key</h3><p>तात्पुरती उत्तरसूची प्रकाशित करणे व objection window सुरू करणे.</p><a onclick="showToast('Provisional key workflow')">Manage key →</a></div><div class="module-card"><div class="bigico">👥</div><h3>Committee Review</h3><p>विषयतज्ज्ञांकडून हरकतींचे परीक्षण आणि निर्णय नोंद.</p><a onclick="showToast('Committee review')">Review objections →</a></div><div class="module-card"><div class="bigico">📑</div><h3>Evaluation</h3><p>Answer-sheet evaluation, moderation आणि score validation.</p><a onclick="showToast('Evaluation dashboard')">Open evaluation →</a></div></div>`)} `}
function results(){return head(pages.results.title,pages.results.sub,`<button class="btn primary" onclick="publishResults()">Publish Results</button>`)+`<div class="note">निकाल प्रकाशित करण्यापूर्वी answer key finalization, score validation, normalization आणि अधिकृत मंजुरी पूर्ण करणे आवश्यक आहे.</div><div class="cards">${stat("Published Exams","06","🏆","निकाल जाहीर")}${stat("Scorecards Generated","18,420","📄","तयार")}${stat("Merit Lists","06","🥇","तयार")}${stat("Pending Approval","02","◷","मंजुरी बाकी")}</div>${panel("Merit List & Scorecard Preview",table(["Candidate ID","Candidate Name","Exam","Score","Rank"],state.results.map(r=>[r[0],r[1],r[2],r[3],r[4]])))}${panel("Result Operations",`<div class="module-grid"><div class="module-card"><div class="bigico">📊</div><h3>Score Processing</h3><p>गुण मोजणी, normalization आणि tie-breaker नियम.</p><a onclick="showToast('Score processing preview')">Process scores →</a></div><div class="module-card"><div class="bigico">🥇</div><h3>Merit List</h3><p>प्रवर्ग/नियमांनुसार अंतिम गुणवत्ता यादी.</p><a onclick="showToast('Merit list preview')">Generate merit list →</a></div><div class="module-card"><div class="bigico">📥</div><h3>Scorecard</h3><p>उमेदवारांसाठी वैयक्तिक निकालपत्र डाउनलोड.</p><a onclick="showToast('Scorecard preview')">View scorecards →</a></div></div>`)} `}
function analytics(){return head(pages.analytics.title,pages.analytics.sub,`<button class="btn primary" onclick="showToast('Report export तयार होत आहे')">Export Report ↓</button>`)+`<div class="cards">${stat("Total Applications","24,580","♙","+8.2%")}${stat("Attendance Rate","94.8%","✓","सर्व परीक्षा")}${stat("Centres Reporting","98.2%","🏫","Live updates")}${stat("Grievances Open","38","✉","निराकरण बाकी")}</div><div class="grid2">${panel("Applications by Examination",`<div class="bar-row"><span>MHT-CET</span><div class="bar"><i style="width:88%"></i></div><b>8,840</b></div><div class="bar-row"><span>Scholarship</span><div class="bar"><i style="width:65%"></i></div><b>6,520</b></div><div class="bar-row"><span>Police Bharti</span><div class="bar"><i style="width:52%"></i></div><b>5,210</b></div><div class="bar-row"><span>Other Exams</span><div class="bar"><i style="width:40%"></i></div><b>4,010</b></div>`)}${panel("Exam Day Operations",`<div class="activity"><i class="dot"></i><div>Centre attendance report<small>326 पैकी 320 केंद्रांचे अहवाल प्राप्त</small></div></div><div class="activity"><i class="dot"></i><div>Incident summary<small>एकूण 12 घटना नोंदवल्या</small></div></div><div class="activity"><i class="dot" style="background:#eab308"></i><div>Grievance resolution<small>38 तक्रारी प्रलंबित</small></div></div>`,"REPORTS")}</div>${panel("Available Reports",table(["Report","Description","Action"],[["Candidate Report","नोंदणी, पडताळणी व उपस्थिती","<button class='btn secondary' onclick='showToast(\"Report तयार\")'>Generate</button>"],["Centre Performance","केंद्रनिहाय क्षमता व अहवाल","<button class='btn secondary' onclick='showToast(\"Report तयार\")'>Generate</button>"],["Question Paper Audit","Vault access व chain of custody","<button class='btn secondary' onclick='showToast(\"Report तयार\")'>Generate</button>"],["Result Analysis","गुण, merit आणि normalization","<button class='btn secondary' onclick='showToast(\"Report तयार\")'>Generate</button>"]]))} `}
function portal(){return head(pages.portal.title,pages.portal.sub)+`<div class="note">उमेदवारांसाठी स्वतंत्र portal चा नमुना. अर्ज क्रमांक व जन्मतारीख वापरून प्रवेश करण्याची demo सुविधा.</div><div class="grid2"><div class="panel"><div class="panel-title"><h3>Candidate Login</h3><span>SECURE ACCESS</span></div><form onsubmit="event.preventDefault();showToast('Demo login: backend authentication जोडणे आवश्यक आहे')"><div class="field" style="margin-bottom:12px"><label>Application / Candidate ID</label><input required placeholder="उदा. PS260001"></div><div class="field" style="margin-bottom:15px"><label>Date of Birth</label><input type="date" required></div><button class="btn primary" type="submit" style="width:100%">Login to Candidate Portal →</button></form></div><div class="panel"><div class="panel-title"><h3>Candidate Services</h3></div><div class="activity"><i class="dot"></i><div>New Exam Application<small>ऑनलाइन अर्ज भरा आणि कागदपत्रे अपलोड करा.</small></div></div><div class="activity"><i class="dot"></i><div>Download Hall Ticket<small>परीक्षा केंद्र, वेळ आणि QR code तपासा.</small></div></div><div class="activity"><i class="dot"></i><div>View Scorecard<small>निकाल आणि गुणपत्रक पाहा.</small></div></div><div class="activity"><i class="dot"></i><div>Submit Objection / Grievance<small>हरकत किंवा तक्रारीची नोंद करा आणि status तपासा.</small></div></div></div></div>${panel("Demo Candidate Records",table(["Candidate ID","Name","Exam","Verification"],state.candidates.map(c=>[c[0],c[1],c[2],badge(c[3])])))}<div class="panel"><div class="panel-title"><h3>Track Application / Grievance</h3></div><div class="toolbar"><input class="search" id="trackId" placeholder="Application / Ticket ID"><button class="btn primary" onclick="track()">Track Status</button></div><div id="trackResult" class="empty">तुमचा ID टाकून अर्ज किंवा तक्रारीची स्थिती पाहा.</div></div>`}
function settings(){return head(pages.settings.title,pages.settings.sub)+`<div class="grid2"><div class="panel"><div class="panel-title"><h3>Portal Configuration</h3></div><div class="field" style="margin-bottom:13px"><label>Portal Name</label><input value="PareekshaSetu"></div><div class="field" style="margin-bottom:13px"><label>Default Language</label><select><option>मराठी + English</option><option>English</option><option>हिंदी</option></select></div><div class="field" style="margin-bottom:13px"><label>Support Email</label><input value="support@example.gov.in"></div><button class="btn primary" onclick="showToast('Demo settings saved')">Save Settings</button></div><div class="panel"><div class="panel-title"><h3>Security & Compliance Checklist</h3></div><div class="activity"><i class="dot"></i><div>Role-based access control<small>Production setup मध्ये लागू करणे आवश्यक</small></div></div><div class="activity"><i class="dot"></i><div>Audit logs & data retention<small>Policy configuration आवश्यक</small></div></div><div class="activity"><i class="dot" style="background:#eab308"></i><div>DPDP / privacy review<small>कायदेशीर व security audit आवश्यक</small></div></div><div class="activity"><i class="dot" style="background:#eab308"></i><div>Biometric consent & encryption<small>Device/backend integration आवश्यक</small></div></div></div></div><div class="note">ही आवृत्ती frontend demo आहे. प्रत्यक्ष सरकारी/उच्च-जोखीम परीक्षांसाठी security audit, privacy assessment, server-side authorization, encryption, backups आणि certified integrations आवश्यक आहेत.</div>`}
function examForm(){return `<form onsubmit="saveExam(event)"><div class="form-grid"><div class="field"><label>Exam Name</label><input name="name" required placeholder="उदा. State CET 2027"></div><div class="field"><label>Exam Date</label><input name="date" type="date" required></div><div class="field"><label>Region / Division</label><input name="region" required placeholder="उदा. Pune Division"></div><div class="field"><label>Exam Shifts</label><select name="status"><option>Planning</option><option>Scheduled</option></select></div></div><p style="text-align:right;margin:18px 0 0"><button class="btn primary">Save Exam</button></p></form>`}
function candidateForm(){return `<form onsubmit="saveCandidate(event)"><div class="form-grid"><div class="field"><label>Candidate ID</label><input name="id" required placeholder="PS260006"></div><div class="field"><label>Candidate Name</label><input name="name" required></div><div class="field full"><label>Examination</label><input name="exam" required></div></div><p style="text-align:right;margin:18px 0 0"><button class="btn primary">Add Candidate</button></p></form>`}
function paperForm(){return `<form onsubmit="savePaper(event)"><div class="form-grid"><div class="field"><label>Paper ID</label><input name="id" required placeholder="QP-2027-01"></div><div class="field"><label>Subject / Exam</label><input name="subject" required></div><div class="field"><label>Vault Status</label><select name="status"><option>Sealed</option><option>In Transit</option></select></div><div class="field"><label>Current Location</label><input name="location" required></div></div><p style="text-align:right;margin:18px 0 0"><button class="btn primary">Save Vault Entry</button></p></form>`}
function objectionForm(){return `<form onsubmit="saveObjection(event)"><div class="form-grid"><div class="field"><label>Objection ID</label><input name="id" required placeholder="OBJ-1023"></div><div class="field"><label>Candidate ID</label><input name="candidate" required></div><div class="field full"><label>Question / Subject</label><input name="question" required placeholder="Question number and subject"></div></div><p style="text-align:right;margin:18px 0 0"><button class="btn primary">Submit Objection</button></p></form>`}
function openModal(title,form){document.getElementById("modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">✕</button></div>${form()}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function showToast(msg){let root=document.getElementById("toastRoot");root.innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>root.innerHTML="",2800)}
function saveExam(e){e.preventDefault();let f=new FormData(e.target);state.exams.push(["EX-"+(2026+state.exams.length)+"-0"+(state.exams.length+1),f.get("name"),f.get("date"),f.get("region"),f.get("status")]);closeModal();render();showToast("नवीन परीक्षा नोंदवली")}
function saveCandidate(e){e.preventDefault();let f=new FormData(e.target);state.candidates.push([f.get("id"),f.get("name"),f.get("exam"),"Pending"]);closeModal();render();showToast("उमेदवार जोडला")}
function savePaper(e){e.preventDefault();let f=new FormData(e.target);state.papers.push([f.get("id"),f.get("subject"),f.get("status"),f.get("location")]);closeModal();render();showToast("Vault entry सेव्ह झाली")}
function saveObjection(e){e.preventDefault();let f=new FormData(e.target);state.objections.push([f.get("id"),f.get("candidate"),f.get("question"),"Under Review"]);closeModal();render();showToast("Objection नोंदवली")}
function verify(id){let c=state.candidates.find(x=>x[0]===id);if(c){c[3]=c[3]==="Verified"?"Pending":"Verified";render();showToast(id+" status updated: "+c[3])}}
function filterRows(input,id){let q=input.value.toLowerCase();let el=document.getElementById(id);if(!el)return;el.querySelectorAll("tbody tr").forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?"":"none")}
function publishResults(){showToast("Demo: अधिकृत मंजुरीनंतरच निकाल प्रकाशित करा")}
function track(){let id=document.getElementById("trackId").value.trim();document.getElementById("trackResult").innerHTML=id?`<b>${id}</b> — Demo status: नोंद तपासणीसाठी प्राप्त. प्रत्यक्ष status साठी backend database जोडणे आवश्यक.`:"कृपया ID टाका."}
function render(){let p=pages[current];document.getElementById("crumb").textContent=p.title;document.getElementById("content").innerHTML=p.render();document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===current));document.getElementById("sidebar").classList.remove("open")}
document.querySelectorAll(".nav button[data-page]").forEach(b=>b.addEventListener("click",()=>{current=b.dataset.page;render()}));
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
render();
</script>
</body></html>
